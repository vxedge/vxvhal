# VSS signal -> Android Automotive vehicle property, one row per property and area.
#
# Property IDs are from AOSP hardware/interfaces automotive/vehicle/aidl_property
# VehicleProperty.aidl at 0162af698935100a590b7359581ac8b1b80693e5 (android17-release, AAOS 26Q2).
# Units: AAOS value = VSS value * scale + offset. VSS units are those of the databroker's VSS
# release; AAOS units are the property's @unit. The pairs follow the COVESA AASIG VSS-to-Android
# binding (wiki.covesa.global "Binding of VSS to Android Properties").
properties:
  - name: PERF_VEHICLE_SPEED
    prop: 0x11600207
    vss: Vehicle.Speed               # VSS km/h, AAOS m/s
    type: float
    scale: 0.2777777777777778        # 1 / 3.6
    change_mode: continuous
    min_sample_rate: 1.0
    max_sample_rate: 10.0
  - name: ENGINE_RPM
    prop: 0x11600305
    vss: Vehicle.Powertrain.CombustionEngine.Speed   # VSS rpm, AAOS rpm
    type: float
    change_mode: continuous
    min_sample_rate: 1.0
    max_sample_rate: 10.0
  - name: PERF_ODOMETER
    prop: 0x11600204
    vss: Vehicle.TraveledDistance    # VSS km, AAOS km
    type: float
    change_mode: continuous
    min_sample_rate: 0.1
    max_sample_rate: 1.0
  - name: GEAR_SELECTION
    prop: 0x11400400
    vss: Vehicle.Powertrain.Transmission.SelectedGear   # VSS int8: 0 neutral, -1 reverse, 126 park, 127 drive
    type: int32
    change_mode: on_change
    # AAOS VehicleGear: GEAR_NEUTRAL 0x1, GEAR_REVERSE 0x2, GEAR_PARK 0x4, GEAR_DRIVE 0x8
    values: { 0: 0x0001, -1: 0x0002, 126: 0x0004, 127: 0x0008 }
    config_array: [0x0001, 0x0002, 0x0004, 0x0008]     # the supported gears, an automatic transmission
