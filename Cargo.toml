[package]
name = "vxvhal"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxvhal"
description = "An Eclipse Kuksa provider that serves Android Automotive's gRPC Vehicle HAL from VSS signals"
publish = false

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
